name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          mkdir -p output
          cp -R ~/Library/Developer/Xcode/DerivedData/JevJarvis-*/Build/Products/Release-iphoneos/JevJarvis.app output/
          cd output
          zip -r JevJarvis-unsigned.zip JevJarvis.app

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-iOS
          path: output/JevJarvis-unsigned.zip
